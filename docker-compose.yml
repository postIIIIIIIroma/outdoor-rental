services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: outdoor_rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/outdoor_rental
    ports: ["8090:8080"]
    depends_on: [db]
volumes:
  pgdata:
