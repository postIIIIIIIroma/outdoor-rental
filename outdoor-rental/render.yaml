databases:
  - name: outdoor-rental-db
    plan: free
    region: frankfurt
    databaseName: outdoor_rental
    user: rental_user

services:
  - type: web
    name: outdoor-rental
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/stats
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: outdoor-rental-db
          property: connectionString
